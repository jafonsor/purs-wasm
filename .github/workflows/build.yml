# Builds the PureScript compiler for the browser and releases it.
#
#   workflow_dispatch   build + test; the assets are kept as a workflow artifact
#   push of a tag v*    build + test + create the GitHub Release with the assets
#
# The slow part is the gmp-free wasm GHC (hours cold, minutes when the Nix
# cache has it). If a cold run could exceed GitHub's 6 h job limit, run the
# workflow by hand with "Only build GHC" ticked: that job stops after the GHC
# and uploads it to the cache; a second run then fetches it and does the rest.
name: Build

on:
  workflow_dispatch:
    inputs:
      only_ghc:
        description: Only build ghc-wasm-native (to warm the cache); skip the rest
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  SYSTEM: x86_64-linux

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      # The runner starts with ~14 GB free; the GHC build needs more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /opt/microsoft /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            fallback = true

      - uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: GHC derivation (built or fetched?)
        run: |
          drv=$(scripts/plan.sh ".#packages.$SYSTEM.ghc-wasm-native" 'ghc-wasm-native-[0-9.]+\.drv$' 2>plan.txt)
          cat plan.txt
          {
            echo "### GHC derivation"
            echo "- derivation and this run: \`$drv\`"
            echo "- nixpkgs \`$(jq -r .nodes.nixpkgs.locked.rev flake.lock)\`, ghc-wasm-meta \`$(jq -r '.nodes."ghc-wasm-meta".locked.rev' flake.lock)\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the gmp-free wasm GHC
        run: |
          start=$(date +%s)
          nix build -L --print-build-logs ".#packages.$SYSTEM.ghc-wasm-native" --out-link ghc-wasm-native
          echo "- ghc-wasm-native: $(( $(date +%s) - start )) s, $(du -sh --apparent-size "$(readlink -f ghc-wasm-native)" | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          df -h /

      - name: Prune the GHC and check the pruned install
        if: github.event.inputs.only_ghc != 'true'
        run: |
          start=$(date +%s)
          nix build -L ".#packages.$SYSTEM.ghc-wasm-native-pruned" --out-link ghc-wasm-native-pruned
          # compiles Template Haskell + Cabal + ghc-heap with the pruned install
          nix build -L ".#checks.$SYSTEM.pruned-smoke" --out-link pruned-smoke
          {
            echo "- ghc-wasm-native-pruned + smoke check: $(( $(date +%s) - start )) s"
            echo "- full: $(du -sm --apparent-size "$(readlink -f ghc-wasm-native)" | cut -f1) MB, pruned: $(du -sm --apparent-size "$(readlink -f ghc-wasm-native-pruned)" | cut -f1) MB"
            echo "- pruned closure (what Nix users download): $(nix path-info -S ".#packages.$SYSTEM.ghc-wasm-native-pruned" | awk '{printf "%.0f MB", $2/1e6}')"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build purs-core.wasm (full GHC)
        if: github.event.inputs.only_ghc != 'true'
        run: |
          start=$(date +%s)
          nix build -L ".#packages.$SYSTEM.purs-core-wasm" --out-link purs-core-wasm
          {
            echo "- purs-core.wasm: $(( $(date +%s) - start )) s"
            echo '```'
            ls -l purs-core-wasm/purs-core.wasm
            sha256sum purs-core-wasm/purs-core.wasm
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build purs-core.wasm again with the pruned GHC (must be identical)
        if: github.event.inputs.only_ghc != 'true'
        run: |
          start=$(date +%s)
          nix build -L ".#packages.$SYSTEM.purs-core-wasm-from-pruned" --out-link purs-core-wasm-from-pruned
          nix build -L ".#checks.$SYSTEM.pruned-same-wasm" --out-link pruned-same-wasm
          {
            echo "- purs-core.wasm from the pruned GHC: $(( $(date +%s) - start )) s, sha256 identical: yes"
            echo '```'
            sha256sum purs-core-wasm-from-pruned/purs-core.wasm
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Assemble the release assets
        if: github.event.inputs.only_ghc != 'true'
        run: |
          start=$(date +%s)
          nix build -L ".#packages.$SYSTEM.release-assets" --out-link release-assets
          mkdir dist
          cp -L release-assets/* dist/
          chmod -R u+w dist
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            jq --arg tag "$GITHUB_REF_NAME" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              '. + {tag: $tag, workflowRun: $run}' dist/BUILDINFO.json > dist/BUILDINFO.tmp
            mv dist/BUILDINFO.tmp dist/BUILDINFO.json
          fi
          (cd dist && sha256sum -c purs-core.wasm.sha256 "ghc-wasm-native-$SYSTEM.tar.xz.sha256")
          {
            echo "- release assets: $(( $(date +%s) - start )) s"
            echo '```'
            ls -l dist
            echo '```'
            echo '```json'
            cat dist/BUILDINFO.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: github.event.inputs.only_ghc != 'true'
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # Runs the built purs-core.wasm under Node's WASI: compile one module, check
  # it produced JavaScript. Uses only the artifact of this run and this repo.
  test:
    needs: build
    if: github.event.inputs.only_ghc != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: dist
      - name: Verify the checksums
        working-directory: dist
        run: sha256sum -c purs-core.wasm.sha256
      - name: Compile a module with purs-core.wasm
        run: node test/smoke.mjs dist/purs-core.wasm | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: dist
      - name: Verify the checksums
        working-directory: dist
        run: sha256sum -c ./*.sha256
      - name: Create the release
        run: |
          tag=$GITHUB_REF_NAME
          {
            echo "PureScript $(jq -r .purescript.version dist/BUILDINFO.json) compiled to WebAssembly, built with GHC $(jq -r .ghc.version dist/BUILDINFO.json) (no gmp)."
            echo
            echo '```'
            (cd dist && cat ./*.sha256)
            echo '```'
            echo
            echo "Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. See README.md for what each file is and how to use it."
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            # a re-run of the tag: replace the files
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --verify-tag --title "$tag" --notes-file notes.md
          fi
